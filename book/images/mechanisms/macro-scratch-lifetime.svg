<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1130" viewBox="0 0 1200 1130" role="img" aria-labelledby="title desc">
<title id="title">Keep scratch bytes until the replacement rescan returns</title>
<desc id="desc">Time runs left to right through a top-level legacy SQUARE(ROWS) expansion. Argument records and an expanded argument are retained in scratch. Two arrows copy the argument 4 into a replacement ((4) * (4)). Rescanning that retained replacement emits a separate copy into cc-src-buf. Only after the scan returns does the scratch cursor reset to saved S; the output copy survives. A second memory drawing shows that temp-end only shrinks a 64 KiB reservation to the used text, without releasing that text. Separator blanks are omitted in the main token view.</desc>
<defs>
<marker id="ink-arrow" markerWidth="8" markerHeight="8" refX="6.8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#172B3A"/></marker>
<marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="6.8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#006B6E"/></marker>
<marker id="orange-arrow" markerWidth="8" markerHeight="8" refX="6.8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#9F4518"/></marker>
<marker id="out-arrow" markerWidth="8" markerHeight="8" refX="6.8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#286D4B"/></marker>
<pattern id="reuse" patternUnits="userSpaceOnUse" width="10" height="10"><rect width="10" height="10" fill="#F7F5EF"/><path d="M-2,2 L2,-2 M0,10 L10,0 M8,12 L12,8" stroke="#D2D8D7" stroke-width="1.3"/></pattern>
</defs>
