<text x="722" y="632" font-family="DejaVu Sans Mono, monospace" font-size="28" fill="#172B3A" font-weight="400" text-anchor="start" >)</text>
<text x="773" y="627" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#9F4518" font-weight="400" text-anchor="start" >kept for scan</text>
