<text x="42" y="86" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#40535F" font-weight="400" text-anchor="start" >Top-level call · legacy profile · token view (separator blanks omitted)</text>
<line x1="42" y1="111" x2="1158" y2="111" stroke="#5D7074" stroke-width="2" />
<text x="42" y="145" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#172B3A" font-weight="400" text-anchor="start" >#define ROWS 4</text>
<text x="42" y="179" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#172B3A" font-weight="400" text-anchor="start" >#define SQUARE(x) ((x) * (x))</text>
<text x="782" y="140" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#40535F" font-weight="700" text-anchor="start" >CALL IN cc-in-buf</text>
<text x="782" y="178" font-family="DejaVu Sans Mono, monospace" font-size="28" fill="#172B3A" font-weight="700" text-anchor="start" >SQUARE(ROWS)</text>
